name: Build Umrah Companion APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing keystore
        run: echo "${{ secrets.UMRAH_KEYSTORE_BASE64 }}" | base64 --decode > umrah-companion.jks

      - name: Build APK
        env:
          UMRAH_KEYSTORE_PASSWORD: ${{ secrets.UMRAH_KEYSTORE_PASSWORD }}
          UMRAH_KEY_ALIAS: ${{ secrets.UMRAH_KEY_ALIAS }}
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Umrah-Companion-APK
          path: app/build/outputs/apk/release/app-release.apk
