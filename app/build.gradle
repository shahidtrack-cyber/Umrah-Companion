plugins {
    id 'com.android.application'
}

android {
    namespace 'com.umrah.companion'
    compileSdk 35

    defaultConfig {
        applicationId "com.umrah.companion"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
        signingConfigs {
        release {
            storeFile file("../umrah-companion.jks")
            storePassword System.getenv("UMRAH_KEYSTORE_PASSWORD")
            keyAlias System.getenv("UMRAH_KEY_ALIAS")
            keyPassword System.getenv("UMRAH_KEYSTORE_PASSWORD")
        }
    }
        buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
